name: Resume Matcher CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Files
        run: |
          python -m py_compile app.py
          python -m py_compile src/matcher.py
          python -m py_compile src/parser.py
          python -m py_compile src/preprocess.py
          python -m py_compile src/recommender.py
          python -m py_compile src/skill_extractor.py
          python -m py_compile scripts/evaluate.py

      - name: Test Core Imports
        run: |
          python -c "import pandas, numpy, sklearn"